<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0a0e1c" />
    <meta name="color-scheme" content="dark" />
    <style>
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#0a0e1c;color:#c7ccda;font:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
      #boot .mark{width:34px;height:34px;border-radius:8px;background:#d9b26a;animation:boot-pulse 1.1s ease-in-out infinite}
      #boot p{margin:0;font-size:13px;letter-spacing:.28em;color:#8b93a9}
      @keyframes boot-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.86);opacity:.72}}
      @media (prefers-reduced-motion: reduce){#boot .mark{animation:none}}
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>bot-for-all</title>
  </head>
  <body>
    <div id="app"><div id="boot"><div class="mark"></div><p>BOT-FOR-ALL</p></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
