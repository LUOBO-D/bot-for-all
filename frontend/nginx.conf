# Production Nginx site for bot-for-all.
# Mounted at /etc/nginx/conf.d/default.conf (this file is included inside the
# http block, so `map` at the top level is valid here).

# Only send "Connection: upgrade" when the client actually asked for it; a
# hardcoded value breaks Socket.IO long-polling fallback.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;

    # Do not leak the upstream framework banner on proxied responses.
    proxy_hide_header X-Powered-By;

    root /usr/share/nginx/html;
    index index.html;

    # Attachment uploads are capped at 10 MB by the API; leave multipart
    # overhead room while keeping oversized JSON cheap to reject.
    client_max_body_size 12m;

    # -- security headers (repeated in locations that add their own headers,
    #    because add_header does not inherit once a location defines one) --
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    # Same policy the backend sends on its own responses (see
    # backend/src/app.ts for the per-directive rationale). Kept byte-identical;
    # a vitest cross-check in backend/test/security-headers.test.ts fails if
    # either copy drifts (including the boot-script hash).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-heFDH7JFx3Q+Tw3QesfP7cXT8wr8z/tkNpVLBm3NYUM='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Used by the compose healthcheck; never touches the backend.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # -- REST API -> backend:3000 (URI passed through unchanged) --
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    # -- Socket.IO: websocket upgrade + long-polling fallback --
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Longer than the Socket.IO heartbeat interval, so idle-but-alive
        # connections are not cut mid-session.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Hashed Vite assets are immutable; `expires` keeps the inherited headers.
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # SPA fallback: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
