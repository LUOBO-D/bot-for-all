services:
  mysql:
    image: mysql:8.4
    container_name: botforall-mysql-dev
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: chat
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "-h", "127.0.0.1", "-uroot", "-pdevroot", "status"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
